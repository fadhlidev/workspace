services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-devdb}
      PGDATA: /var/lib/postgresql/data/pgdata

      # Performance tuning (override via env if needed)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-devdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c max_connections=100
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c wal_level=logical
        -c max_wal_senders=5
        -c log_statement=all
        -c log_duration=on
        -c log_min_duration_statement=100
        -c log_line_prefix='%t [%p] %u@%d '
        -c timezone=Asia/Jakarta

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - dev_net

  # --- pgAdmin (optional UI) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: [ui] # Only starts with: docker compose --profile ui up

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    ports:
      - "${PGADMIN_PORT:-5050}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - dev_net

minio:
  image: minio/minio:latest
  container_name: minio
  restart: unless-stopped
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secretpass}
    MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
  ports:
    - "${MINIO_API_PORT:-9000}:9000" # S3 API endpoint
    - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
  volumes:
    - minio_data:/data
  command: server /data --console-address ":9001"
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - dev_net

minio-init:
  image: minio/mc:latest
  container_name: minio-init
  depends_on:
    minio:
      condition: service_healthy
  entrypoint: >
    /bin/sh -c "
    mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-secretpass};
    mc mb -p local/${MINIO_BUCKET:-app-storage};
    mc anonymous set download local/${MINIO_BUCKET:-app-storage}/public;
    exit 0;
    "
  networks:
    - dev_net

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  dev_net:
    driver: bridge
