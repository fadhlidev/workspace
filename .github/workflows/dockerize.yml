name: Dockerize

on:
  push:
    branches:
      - main

jobs:
  dockerize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image name and version from package.json
        id: vars
        run: |
          RAW_NAME=$(jq -r .name package.json)
          IMAGE_NAME=$(echo "$RAW_NAME" | sed 's/^@//; s/\//-/g')
          VERSION=$(jq -r .version package.json)
          DOCKER_IMAGE="$IMAGE_NAME:$VERSION"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DOCKER_IMAGE=$DOCKER_IMAGE" >> "$GITHUB_ENV"
          echo "Building $DOCKER_IMAGE"

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE .

      - name: Save Docker image as tar.gz
        run: docker save $DOCKER_IMAGE | gzip > image.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.VERSION }}
          path: image.tar.gz
          retention-days: 7
