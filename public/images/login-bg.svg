<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#c4b8a8" flood-opacity="0.22"/>
    </filter>
    <!-- Soft glow for sparkles -->
    <filter id="sparkleGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Body gradient: cream/white -->
    <radialGradient id="bodyGrad" cx="45%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FFFEF5"/>
      <stop offset="100%" stop-color="#F0ECDC"/>
    </radialGradient>
    <!-- Orange patch gradient -->
    <radialGradient id="orangeGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F2A95A"/>
      <stop offset="100%" stop-color="#D9833A"/>
    </radialGradient>
    <!-- Brown patch gradient -->
    <radialGradient id="brownGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7B5230"/>
      <stop offset="100%" stop-color="#5A3A1A"/>
    </radialGradient>
  </defs>

  <!-- ──────────────── BACKGROUND ──────────────── -->
  <rect width="1440" height="900" fill="#FAFAE8"/>

  <!-- ──────────────── PINK GLOW CIRCLE ──────────────── -->
  <circle cx="1010" cy="430" r="230" fill="#F9D5DC" opacity="0.85"/>
  <!-- Lighter inner halo -->
  <circle cx="1010" cy="430" r="180" fill="#FCDDE3" opacity="0.6"/>

  <!-- ──────────────── SPARKLES ──────────────── -->
  <g fill="white" filter="url(#sparkleGlow)" opacity="0.95">
    <!-- Sparkle top-left of circle -->
    <path d="M 855 310 L 859 322 L 871 326 L 859 330 L 855 342 L 851 330 L 839 326 L 851 322 Z"/>
    <!-- Sparkle top-right of circle -->
    <path d="M 1130 285 L 1133 294 L 1142 297 L 1133 300 L 1130 309 L 1127 300 L 1118 297 L 1127 294 Z"/>
    <!-- Small sparkle top center -->
    <path d="M 990 268 L 992 274 L 998 276 L 992 278 L 990 284 L 988 278 L 982 276 L 988 274 Z"/>
  </g>

  <!-- ──────────────── SHADOW UNDER CAT ──────────────── -->
  <ellipse cx="1005" cy="640" rx="215" ry="28" fill="#C8C0A8" opacity="0.35"/>

  <!-- ──────────────── PAPERS on floor ──────────────── -->
  <!-- Left paper -->
  <g transform="rotate(-18, 910, 640)">
    <rect x="840" y="610" width="140" height="100" rx="4" fill="white" stroke="#E0D8C8" stroke-width="1.5"/>
    <!-- Paper lines -->
    <line x1="858" y1="635" x2="958" y2="635" stroke="#E8E0D0" stroke-width="1.5"/>
    <line x1="858" y1="650" x2="958" y2="650" stroke="#E8E0D0" stroke-width="1.5"/>
    <line x1="858" y1="665" x2="940" y2="665" stroke="#E8E0D0" stroke-width="1.5"/>
  </g>
  <!-- Right paper -->
  <g transform="rotate(12, 1100, 640)">
    <rect x="1000" y="615" width="155" height="105" rx="4" fill="white" stroke="#E0D8C8" stroke-width="1.5"/>
    <!-- Paper lines -->
    <line x1="1018" y1="640" x2="1138" y2="640" stroke="#E8E0D0" stroke-width="1.5"/>
    <line x1="1018" y1="655" x2="1138" y2="655" stroke="#E8E0D0" stroke-width="1.5"/>
    <line x1="1018" y1="670" x2="1115" y2="670" stroke="#E8E0D0" stroke-width="1.5"/>
  </g>

  <!-- ──────────────── PENCIL ──────────────── -->
  <g transform="rotate(-35, 940, 590)" filter="url(#shadow)">
    <!-- Pencil body -->
    <rect x="920" y="490" width="18" height="110" rx="2" fill="#F2C94C"/>
    <!-- Eraser end -->
    <rect x="920" y="488" width="18" height="12" rx="2" fill="#F4A7B9"/>
    <!-- Ferrule -->
    <rect x="920" y="498" width="18" height="6" fill="#D4A853"/>
    <!-- Pencil tip wood -->
    <polygon points="920,600 938,600 929,622" fill="#D9A87A"/>
    <!-- Pencil tip graphite -->
    <polygon points="924,612 934,612 929,622" fill="#555"/>
  </g>

  <!-- ──────────────── CAT BODY (main blob) ──────────────── -->
  <!-- Big chubby cream body -->
  <ellipse cx="1005" cy="565" rx="195" ry="145" fill="url(#bodyGrad)" stroke="#3D2B1A" stroke-width="2.5"/>

  <!-- ──────────────── ORANGE BACK / RUMP ──────────────── -->
  <!-- Large orange patch on back-left -->
  <ellipse cx="870" cy="520" rx="105" ry="90" fill="#E8933A" stroke="#3D2B1A" stroke-width="2"/>
  <!-- Orange ear region / back of body blending -->
  <ellipse cx="905" cy="490" rx="75" ry="60" fill="#F0A040"/>

  <!-- ──────────────── BROWN PATCHES ──────────────── -->
  <!-- Forehead patch -->
  <ellipse cx="1060" cy="455" rx="38" ry="35" fill="#7B5230" opacity="0.9"/>
  <!-- Back saddle patch -->
  <ellipse cx="950" cy="515" rx="55" ry="40" fill="#7B5230" opacity="0.85"/>
  <!-- Small spot near tail -->
  <ellipse cx="830" cy="545" rx="28" ry="22" fill="#7B5230" opacity="0.75"/>

  <!-- ──────────────── TAIL ──────────────── -->
  <path d="M 850 470 C 810 430 780 370 820 330 C 855 295 895 320 870 360 C 850 390 855 440 870 460"
        fill="#E8933A" stroke="#3D2B1A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tail tip (darker) -->
  <path d="M 815 335 C 820 315 840 308 855 320 C 840 318 822 330 820 348 Z" fill="#D9833A"/>

  <!-- ──────────────── HEAD ──────────────── -->
  <!-- Head circle -->
  <circle cx="1072" cy="468" r="95" fill="url(#bodyGrad)" stroke="#3D2B1A" stroke-width="2.5"/>

  <!-- Ears -->
  <!-- Left ear -->
  <polygon points="992,400 1012,440 1040,415" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="999,407 1012,430 1032,412" fill="#F4B8C4" opacity="0.8"/>
  <!-- Right ear -->
  <polygon points="1100,390 1108,435 1145,405" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="1104,398 1111,428 1138,410" fill="#F4B8C4" opacity="0.8"/>

  <!-- ──────────────── FACE ──────────────── -->
  <!-- Face patch / muzzle area (lighter oval) -->
  <ellipse cx="1072" cy="488" rx="52" ry="45" fill="#FFFEF8" opacity="0.9"/>

  <!-- Eyes -->
  <!-- Left eye (sleepy/content half-closed) -->
  <ellipse cx="1042" cy="462" rx="11" ry="12" fill="#2A1A0A"/>
  <ellipse cx="1042" cy="460" rx="4" ry="4" fill="white" opacity="0.7"/>
  <!-- Right eye -->
  <ellipse cx="1098" cy="462" rx="11" ry="12" fill="#2A1A0A"/>
  <ellipse cx="1098" cy="460" rx="4" ry="4" fill="white" opacity="0.7"/>

  <!-- Nose (small pink triangle) -->
  <polygon points="1069,484 1075,484 1072,490" fill="#F4A7A7" stroke="#D08080" stroke-width="0.8"/>

  <!-- Mouth (cute W shape) -->
  <path d="M 1065 492 Q 1069 496 1072 493 Q 1075 496 1079 492" stroke="#3D2B1A" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Blush cheeks -->
  <ellipse cx="1030" cy="484" rx="16" ry="10" fill="#F4B8B0" opacity="0.55"/>
  <ellipse cx="1114" cy="484" rx="16" ry="10" fill="#F4B8B0" opacity="0.55"/>

  <!-- Whiskers -->
  <!-- Left whiskers -->
  <line x1="990" y1="477" x2="1035" y2="483" stroke="#3D2B1A" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <line x1="988" y1="485" x2="1033" y2="487" stroke="#3D2B1A" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <line x1="990" y1="493" x2="1033" y2="492" stroke="#3D2B1A" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <!-- Right whiskers -->
  <line x1="1109" y1="483" x2="1155" y2="477" stroke="#3D2B1A" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <line x1="1111" y1="487" x2="1157" y2="485" stroke="#3D2B1A" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <line x1="1111" y1="492" x2="1156" y2="493" stroke="#3D2B1A" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>

  <!-- ──────────────── FRONT PAWS ──────────────── -->
  <!-- Left paw (stretched out on paper) -->
  <ellipse cx="930" cy="625" rx="65" ry="30" fill="url(#bodyGrad)" stroke="#3D2B1A" stroke-width="2"/>
  <!-- Paw toes left -->
  <ellipse cx="900" cy="623" rx="14" ry="11" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="1.5"/>
  <ellipse cx="920" cy="618" rx="13" ry="11" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="1.5"/>
  <ellipse cx="940" cy="617" rx="13" ry="11" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="1.5"/>
  <ellipse cx="960" cy="620" rx="13" ry="11" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="1.5"/>

  <!-- Right paw (closer, more in front) -->
  <ellipse cx="1075" cy="630" rx="65" ry="30" fill="url(#bodyGrad)" stroke="#3D2B1A" stroke-width="2"/>
  <!-- Paw toes right -->
  <ellipse cx="1045" cy="628" rx="14" ry="11" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="1.5"/>
  <ellipse cx="1065" cy="623" rx="13" ry="11" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="1.5"/>
  <ellipse cx="1085" cy="622" rx="13" ry="11" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="1.5"/>
  <ellipse cx="1105" cy="625" rx="13" ry="11" fill="#F0ECDC" stroke="#3D2B1A" stroke-width="1.5"/>

  <!-- ──────────────── CHIN resting on paws ──────────────── -->
  <ellipse cx="1000" cy="600" rx="60" ry="28" fill="#FFFEF5" stroke="#3D2B1A" stroke-width="1.5" opacity="0.85"/>


</svg>
